<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact</title>
    <link rel="stylesheet" href="../style/index.css" />
    <link rel="stylesheet" href="../style/contact.css" />
    <link rel="icon" type="image/x-icon" href="../assets/website_icon.svg" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.rawgit.com/dreampulse/computer-modern-web-font/master/fonts.css"
    />
  </head>
  <body>
    <nav>
      <a href="../index.html">
        <img src="../assets/dragon_icon.svg" alt="dragon icon" id="logo" />
      </a>

      <div class="navLinks">
        <a href="resume.html">resume</a>
        <a href="blog.html">blog</a>
        <a href="contact.html">contact</a>
      </div>
    </nav>

    <main class="main">
      <form id="contactForm">
        <input type="text" placeholder="name"><br>
        <input type="text" placeholder="subject"><br>
        <textarea placeholder="message" rows="3"></textarea>
        <input type="submit" value="submit">
      </form>
      <div id="information">
        <h1>feel free to reach out!</h1>
        <p id="mainMessage">
          whether it be about the website, projects that I should focus on, blog
          articles to write, or just getting in touch feel free to message me.
        </p>
        <p id="email">email: benard.kihiuria@gmail.com</p>
        <div id="socials">
          <a href="https://www.linkedin.com/in/benard-kihiuria" class="iconHolder">
            <img
              src="../assets/linkedin-icon.svg"
              alt="linkedin-icon"
              id="linkedin-icon"
            />
          </a>
          <a href="https://github.com/tkofb" class="iconHolder">
            <img
              src="../assets/github-icon.svg"
              alt="github-icon"
              id="github-icon"
            />
          </a>
        </div>
      </div>
    </main>

    <script src="../js/contact.js"></script>
  </body>
</html>
